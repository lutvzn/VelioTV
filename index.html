<html>
  <head>
    <style>
      html,
      body,
      * {
        padding: 0;
        margin: 0;
      }
      /* The app draws everything on one canvas. The page itself must never
         scroll, or the remote's arrow keys move the whole UI. */
      html,
      body {
        overflow: hidden;
      }
    </style>
    <meta charset="UTF-8" />
  </head>

  <body>
    <div id="app"></div>
    <script type="module" src="src/main.ts"></script>
  </body>
</html>
