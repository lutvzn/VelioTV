name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Uses the pnpm version from package.json's packageManager field.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Native Chromium, matching the TVs' browser family.
      - run: pnpm exec playwright install --with-deps chromium

      - name: Format, lint, type check and test
        run: pnpm check
        env:
          CI: "true"

      # Signing needs the Samsung certificates, so CI only checks that the
      # Samsung build succeeds.
      - name: Build for Samsung
        run: pnpm build
        env:
          TARGET_DEVICE: tizen

      # No TV this old is at hand, so check the build reads on Chromium 68.
      - name: Check the build for older TVs
        run: pnpm check:old-tvs dist/tizen
