name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Full URLs, because short names resolve to Forgejo's own mirror of
      # actions, which may lag behind. The v4 actions run on Node 20, which
      # Forgejo runners support.
      - uses: https://github.com/actions/checkout@v4

      # Uses the pnpm version from package.json's packageManager field.
      - uses: https://github.com/pnpm/action-setup@v4

      - uses: https://github.com/actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The tests run in WebKit, the closest desktop engine to the TVs' browsers.
      - run: pnpm exec playwright install --with-deps webkit

      - name: Format, lint, type check and test
        run: pnpm check
        env:
          CI: "true"

      # Signing needs the Samsung certificates, so CI only checks that the
      # Samsung build succeeds.
      - name: Build for Samsung
        run: pnpm build
        env:
          TARGET_DEVICE: tizen
