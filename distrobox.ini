[tv-dev]
image=docker.io/library/ubuntu:24.04
home=$HOME/.local/share/boxes/tv-dev
pull=true
start_now=true
additional_packages="git curl unzip ca-certificates openjdk-17-jre libsecret-1-0 gnome-keyring aria2 ffmpeg fonts-dejavu-core"

# Only for running Chromium 47 (Tizen 3) and 38 (webOS 3) in
# scripts/old-chrome/run.mjs: they need GConf and GTK 2, which newer
# Ubuntus dropped, and have no headless mode, so they draw on Xvfb.
[old-chrome]
image=docker.io/library/ubuntu:18.04
home=$HOME/.local/share/boxes/old-chrome
pull=true
start_now=true
additional_packages="libgconf-2-4 libgtk2.0-0 libnss3 libxss1 libasound2 libxtst6 libx11-xcb1 libudev1 libgl1-mesa-glx libgl1-mesa-dri xvfb fonts-dejavu-core"
